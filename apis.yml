aid: venwiz
name: Venwiz
description: 'Venwiz is a Bengaluru, India based B2B digital platform for the procurement
  of industrial and infrastructural project services, covering both CapEx and MRO
  requirements for the manufacturing sector. Founded in 2020 by Rajesh Reddy and Sandesh
  Paturi, it operates a marketplace that connects industrial buyers with a verified,
  pan-India database of service vendors, adding vendor discovery, order expediting,
  project management tooling and vendor intelligence on top. Backed by Accel and other
  investors (~$11.4M raised), Venwiz digitises what has traditionally been an offline,
  relationship-driven industrial services procurement process. No public developer
  API, OpenAPI/Swagger definition, SDK, or documentation surface is published as of
  this enrichment pass; the public presence is a marketing/content website plus a
  login-gated application.'
